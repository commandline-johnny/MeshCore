name: Build TDeck MQTT Observer

on:
  push:
    branches: [mqtt-bridge-implementation-flex]
    paths:
      - 'variants/lilygo_tdeck/**'
      - 'src/**'
      - 'examples/simple_repeater/**'
      - 'platformio.ini'
      - '.github/workflows/build-tdeck-observer.yml'
  workflow_dispatch:

env:
  FIRMWARE_VERSION: dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-toolchains-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-toolchains-${{ runner.os }}-

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Set firmware version
        run: echo "FIRMWARE_VERSION=dev-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build TDeck observer firmware
        run: /usr/bin/env bash build.sh build-firmware LilyGo_TDeck_repeater_observer_mqtt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdeck-observer-${{ env.FIRMWARE_VERSION }}
          path: out/
          if-no-files-found: error
